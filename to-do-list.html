<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="assets/css/styletodo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

</head>
<body>
    <div class="container">
        <div class="profil-section">
            <img src="assets/image/my-pic.jpg" alt="" class="profil-img">
            <p class="username">لالا</p>
            <p class="handle">@lalazahra</p>
            <button class="logout">خروج</button>
        </div>

        <div class="todo-section">
            <div class="clock-container">
                <div class="clock">
                    <div class="hand hour-hand"></div>
                    <div class="hand minute-hand"></div>
                    <div class="hand second-hand"></div>
                </div>
                <h5>عصر بخیر</h5>
            </div>

            <div class="task-container">
                <div class="task-header">
                    <p class="task-title">لیست کار ها</p>
                    <span class="add-btn"><i class="fa-solid fa-plus"></i></span>
                
    
                <div class="task-list">
    
                    <div class="task">
                        <input type="checkbox">خوردن صبحانه ساعت 8 صبح
                    </div>
    
                    <div class="task">
                        <input type="checkbox">ورزش کردن ساعت 11 ظهر
                    </div>
    
                    <div class="task">
                        <input type="checkbox">خوردن ناهار ساعت 12:30 ظهر 
                    </div>
    
                    <div class="task">
                        <input type="checkbox">اموزش html,css ساعت 3 ظهر 
                    </div>
    
                    <div class="task">
                        <input type="checkbox">اماده کردن شام ساعت 7 غروب
                    </div>
                </div>
    
                </div>
            </div>
        </div>

        
    </div>
</body>
</html>
